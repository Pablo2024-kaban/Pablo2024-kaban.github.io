<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Р-326М</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body { background:#080808; color:#9a9a8a; font-family:'Share Tech Mono', monospace; margin:0; min-height:100vh; display:flex; justify-content:center; padding:12px; }
  .container { max-width:820px; width:100%; }
  .top-bar { border:1px solid #1a1a1a; background:#0a0a0a; padding:7px 10px; display:flex; justify-content:space-between; }
  .hash-top { color:#2a2a1e; font-size:11px; word-break:break-all; }
  .clock { color:#151515; font-size:10px; }
  .radio-chassis { margin-top:12px; background:linear-gradient(180deg,#1c1a12 0%, #0e0d0a 100%); border:2px solid #25231c; border-radius:5px; padding:14px; }
  .radio-top { display:grid; grid-template-columns:1fr 240px; gap:14px; }
  @media (max-width:780px){ .radio-top{grid-template-columns:1fr} }
  .display-section { background:#000; border:1px solid #151515; padding:9px; }
  .freq-led { font-size:42px; color:#b0b0a0; text-align:center; letter-spacing:4px; background:#050505; padding:10px; border:1px solid #1a1a1a; }
  .freq-led small { font-size:10px; color:#2a2a2a; display:block; }
  .scale { position:relative; height:34px; background:#080808; border:1px solid #141414; margin-top:10px; }
  .tick { position:absolute; bottom:0; width:1px; background:#1f1f1f; } .tick.major{height:18px;background:#2a2a2a}
  .pointer{position:absolute;top:0;bottom:0;width:1px;background:#3a3a3a}
  .s-meter{margin-top:9px;display:flex;gap:2px;height:14px;background:#000;border:1px solid #111;padding:2px}
  .s-bar{width:8%;background:#0e0e0e;height:100%}.s-bar.active{background:#3a3a3a}
  .waterfall{height:46px;background:#000;border:1px solid #0e0e0e;margin-top:8px;overflow:hidden} canvas{width:100%;height:100%;display:block;filter:grayscale(1)}
  .knob-section{background:#0f0f0f;border:1px solid #151515;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .knob{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #3a3a3a 0%, #151515 50%, #070707 100%);border:1px solid #222;position:relative;cursor:grab;touch-action:none;flex-shrink:0}
  .knob-mark{position:absolute;left:50%;top:8%;width:2px;height:16px;background:#666;transform:translateX(-50%)}
  .knob-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#000;border-radius:50%;border:1px solid #222}
  .power-btn{padding:6px 12px;background:#0f0f0f;color:#2a2a2a;border:1px solid #1d1d1d;cursor:pointer;font-family:inherit;font-size:11px}
  .power-btn.on{color:#777;border-color:#333}
  .controls{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .ctrl-btn{background:#0a0a0a;color:#2e2e2e;border:1px solid #181818;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:10px}
  input[type=range]{width:100%;accent-color:#222;height:24px;background:#0a0a0a}
  .freq-info{display:flex;justify-content:space-between;font-size:8px;color:#1a1a1a}
  .status{margin-top:10px;min-height:70px;background:#000;border:1px solid #0f0f0f;padding:8px;font-size:12px;line-height:1.35;color:#4a4a3a}
  .status.locked{border-color:#222;color:#7a7a6a}.found{background:#050505;border:1px solid #1a1a1a;padding:7px;color:#8a8a7a}

  /* Battery under knob - visual rectangular lid */
  .battery-under{ width:100%; margin-top:6px; }
  .battery-box{ width:100%; border:1px solid #201e15; background:#0a0906; border-radius:3px; overflow:hidden; }
  .battery-lid-visual{
    width:100%; height:64px; background:#1d1b12; border:1px solid #2a281c; border-radius:2px;
    position:relative; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 #3a3828, inset 0 -1px 0 #000, 0 2px 4px #000; transition: all 0.2s;
  }
  .battery-lid-visual:hover{ background:#232114; }
  .battery-lid-visual::before{
    content:''; position:absolute; top:6px; left:6px; right:6px; height:8px;
    background:repeating-linear-gradient(90deg,#2a281c 0px,#2a281c 2px,#1d1b12 2px,#1d1b12 6px);
    opacity:0.6; border-radius:1px;
  }
  .battery-lid-visual::after{
    content:''; position:absolute; bottom:6px; left:6px; right:6px; height:8px;
    background:repeating-linear-gradient(90deg,#2a281c 0px,#2a281c 2px,#1d1b12 2px,#1d1b12 6px);
    opacity:0.6; border-radius:1px;
  }
  .lid-screw{ position:absolute; width:6px; height:6px; background:#0a0a0a; border:1px solid #3a382a; border-radius:50%; box-shadow:inset 0 1px 1px #555; }
  .lid-screw.tl{ top:4px; left:4px; } .lid-screw.tr{ top:4px; right:4px; }
  .lid-screw.bl{ bottom:4px; left:4px; } .lid-screw.br{ bottom:4px; right:4px; }
  .lid-text{ font-size:9px; color:#5a5642; letter-spacing:0.5px; text-align:center; max-width:150px; line-height:1.2; margin-top:4px; text-transform:lowercase; }
  .battery-box.open .battery-lid-visual{ background:#0a0a08; border-color:#111; transform:translateY(-2px); box-shadow:inset 0 0 10px #000; }
  .battery-box.open .battery-lid-visual .lid-text{ color:#2a2a20; }
  .battery-inner{ max-height:0; overflow:hidden; transition:max-height 0.7s cubic-bezier(0.4,0,0.2,1), padding 0.5s; background:#050505; padding:0 10px; }
  .battery-box.open .battery-inner{ max-height:420px; padding:10px; }
  .flag-sleep{ font-size:14px; color:#ffcc33; letter-spacing:2px; background:#111; display:inline-block; padding:5px 8px; border:1px solid #333; margin:8px 0; }
  .bat-visual{display:flex; gap:12px; align-items:center; justify-content:center; }
  .bat-slot{ width:96px; background:#080808; border:1px inset #1e1e1e; padding:6px; display:flex; flex-direction:column; gap:6px; }
  .bat-empty{ height:18px; background:#000; border:1px dashed #1c1c1c; color:#141414; font-size:7px; display:flex; align-items:center; justify-content:center; letter-spacing:1px; }
  .bat-removed{ display:flex; flex-direction:column; gap:8px; transform:translateY(20px); opacity:0; transition:all 0.5s 0.25s ease; }
  .battery-box.open .bat-removed{ transform:translateY(0); opacity:1; }
  .battery{ width:72px; height:20px; background:linear-gradient(90deg,#2a2a1a 0%, #3d381c 100%); border:1px solid #444; border-radius:2px; display:flex; align-items:center; justify-content:space-between; padding:0 4px; position:relative; }
  .battery::after{ content:''; position:absolute; right:-4px; top:50%; transform:translateY(-50%); width:3px; height:9px; background:#666; border-radius:0 2px 2px 0; }
  .b-plus{font-size:6px;color:#888} .b-body{font-size:7px;color:#ffcc66} .b-minus{font-size:8px;color:#444}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar"><span class="hash-top">f84edce385ed38b1b008771628c9df65</span><span class="clock" id="clock">--:--:--</span></div>
  <div class="radio-chassis" id="chassis">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;"><button class="power-btn" id="powerBtn">⏻ ВКЛ</button></div>
    <div class="radio-top">
      <div class="display-section">
        <div class="freq-led" id="freqDisplay">----<small>кГц</small></div>
        <div class="scale" id="scale"></div>
        <div class="s-meter" id="sMeter"></div>
        <div class="waterfall"><canvas id="wf" width="600" height="46"></canvas></div>
        <div style="margin-top:9px"><input type="range" id="freqSlider" min="4000" max="5000" value="4077" step="1" disabled><div class="freq-info"><span>4000</span><span>5000</span></div></div>
        <div class="controls"><button class="ctrl-btn" data-d="-10">-10</button><button class="ctrl-btn" data-d="-1">-1</button><button class="ctrl-btn" id="scanL">SCAN ◀</button><button class="ctrl-btn" id="scanR">▶ SCAN</button><button class="ctrl-btn" data-d="1">+1</button><button class="ctrl-btn" data-d="10">+10</button></div>
        <div class="status" id="status">Радио аполкалипсис</div>
      </div>
      <div class="knob-section">
        <div class="knob" id="knob"><div class="knob-mark"></div><div class="knob-center"></div></div>
        <div style="font-size:7px;color:#333;letter-spacing:1px">TUNE</div>

        <!-- ОТСЕК ДЛЯ БАТАРЕЕК ПОД КРУТИЛКОЙ В ПРЯМОУГОЛЬНИКЕ -->
        <div class="battery-under">
          <div class="battery-box" id="batteryBox">
            <div class="battery-lid-visual" id="batLid">
              <div class="lid-screw tl"></div><div class="lid-screw tr"></div>
              <div class="lid-screw bl"></div><div class="lid-screw br"></div>
              <div class="lid-text">вынуть батарейки и лечь спать</div>
            </div>
            <div class="battery-inner">
              <div class="bat-visual">
                <div class="bat-slot"><div class="bat-empty">EMPTY</div><div class="bat-empty">EMPTY</div></div>
                <div class="bat-removed">
                  <div class="battery"><span class="b-plus">+</span><span class="b-body">BR7</span><span class="b-minus">-</span></div>
                  <div class="battery"><span class="b-plus">+</span><span class="b-body">BR7</span><span class="b-minus">-</span></div>
                </div>
              </div>
              <div style="margin-top:10px;text-align:center">
                <div style="color:#4a4a3a;font-size:8px;letter-spacing:1px">БАТАРЕЙКИ ВЫНУТЫ</div>
                <div class="flag-sleep">SLEEP-TIL-NOON</div>
                <div style="color:#2e2e26;font-size:9px;margin-top:6px;line-height:1.3">Ты выключаешь радио, пьешь воду из батареи, накрываешься пледом.<br>Вечером зайдет начальник с актом об увольнении.<br></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<audio id="stormAudio" src="./u.mp3" preload="auto" loop></audio>
<audio id="b7Audio" src="./Pastebin.mp3" preload="auto" loop></audio>

<script>
let powerOn=false, freq=4077, scanning=null;
const slider=document.getElementById('freqSlider'), display=document.getElementById('freqDisplay'), statusEl=document.getElementById('status');
const storm=document.getElementById('stormAudio'), b7=document.getElementById('b7Audio');
const knob=document.getElementById('knob'), scaleEl=document.getElementById('scale'), sMeterEl=document.getElementById('sMeter');
const powerBtn=document.getElementById('powerBtn'), canvas=document.getElementById('wf'), ctx=canvas.getContext('2d');

for(let f=4000; f<=5000; f+=20){ let perc=(f-4000)/10; let tick=document.createElement('div'); tick.className=(f%100===0)?'tick major':'tick'; tick.style.left=perc+'%'; tick.style.height=(f%100===0)?'18px':'8px'; scaleEl.appendChild(tick); }
let pointer=document.createElement('div'); pointer.className='pointer'; scaleEl.appendChild(pointer);
for(let i=0;i<12;i++){ let b=document.createElement('div'); b.className='s-bar'; b.id='s'+i; sMeterEl.appendChild(b); }

let audioCtx, whiteNode, whiteGain;

function startAudio(audio) {
  // Ошибки воспроизведения не выводим в интерфейс и консоль.
  const result = audio.play();
  if (result && typeof result.catch === 'function') {
    result.catch(() => {});
  }
}

function stopAudio(audio) {
  audio.pause();
  audio.currentTime = 0;
}
function initWhite(){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let len=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.35;
    whiteNode=audioCtx.createBufferSource(); whiteNode.buffer=buf; whiteNode.loop=true;
    whiteGain=audioCtx.createGain(); whiteGain.gain.value=0;
    whiteNode.connect(whiteGain).connect(audioCtx.destination); whiteNode.start();
  }catch(e){}
}
function togglePower(){
  if(!powerOn){
    let box=document.getElementById('batteryBox'); if(box.classList.contains('open')) box.classList.remove('open');
    if(!audioCtx) initWhite();
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    powerOn=true; powerBtn.textContent='⏻ ВЫКЛ'; powerBtn.classList.add('on'); slider.disabled=false;
    audioError = '';
    statusEl.textContent='ШШШ...';
    storm.volume=0; b7.volume=0;

    // Не скрываем ошибку play(): раньше она подавлялась пустым catch().
    // Вызов остаётся внутри клика по кнопке питания.
    startAudio(storm);
    startAudio(b7);
    if(whiteGain) whiteGain.gain.value=0.35;
    updateRadio(); requestAnimationFrame(waterfall);
  }else{
    powerOn=false; powerBtn.textContent='⏻ ВКЛ'; powerBtn.classList.remove('on'); slider.disabled=true;
    try{ stopAudio(storm); stopAudio(b7); }catch(e){}
    if(whiteGain) whiteGain.gain.value=0;
    statusEl.textContent='Питание выключено.';
  }
}
function updateRadio(){
  if(!powerOn) return;
  display.innerHTML=freq+'<small>кГц</small>'; slider.value=freq;
  pointer.style.left=((freq-4000)/10)+'%';
  let deg=((freq-4000)/1000)*270-135; knob.style.transform=`rotate(${deg}deg)`;
  let dS=Math.abs(freq-4210), dB=Math.abs(freq-4825);
  let sVol=Math.max(0,1-dS/14), bVol=Math.max(0,1-dB/14);
  let wVol=1-Math.max(sVol,bVol)*0.85; if(wVol<0.05) wVol=0.05;
  storm.volume=sVol; b7.volume=bVol;
  if(whiteGain) whiteGain.gain.value=wVol*0.35;
  let bars=Math.floor(Math.max(sVol,bVol)*12);
  for(let i=0;i<12;i++){ document.getElementById('s'+i).className='s-bar'+(i<bars?' active':''); }
  if(freq===4210){
    statusEl.className='status locked';
    statusEl.innerHTML=`<div class="found">> 4210 кГц — LOCK</div>`;
  }else if(freq===4825){
    statusEl.className='status locked';
    statusEl.innerHTML=`<div class="found">> 4825 кГц — LOCK</div>`;
  }else if(dS<=6 || dB<=6){
    statusEl.className='status'; statusEl.textContent=`${freq} — ...сигнал... S=${bars}`;
  }else{
    statusEl.className='status'; statusEl.textContent=`${freq} — ШШШ... S=${bars}`;
  }
}
function nudge(d){ if(!powerOn) togglePower(); freq=Math.min(5000,Math.max(4000,freq+d)); updateRadio(); }
function autoScan(dir){ if(!powerOn) togglePower(); if(scanning) clearInterval(scanning); scanning=setInterval(()=>{ freq+=dir; if(freq>5000||freq<4000){ clearInterval(scanning); return; } updateRadio(); if(freq===4210||freq===4825) clearInterval(scanning); },115); }

document.getElementById('powerBtn').addEventListener('click', togglePower);
document.querySelectorAll('.ctrl-btn[data-d]').forEach(b=>b.addEventListener('click', ()=>nudge(parseInt(b.dataset.d))));
document.getElementById('scanL').addEventListener('click', ()=>autoScan(-1));
document.getElementById('scanR').addEventListener('click', ()=>autoScan(1));
slider.addEventListener('input', e=>{ freq=parseInt(e.target.value); updateRadio(); });

let isDrag=false,lastA=0;
knob.addEventListener('pointerdown',e=>{isDrag=true;knob.setPointerCapture(e.pointerId);lastA=getA(e);});
knob.addEventListener('pointermove',e=>{ if(!isDrag) return; let a=getA(e), d=a-lastA; if(d>180)d-=360; if(d<-180)d+=360; if(Math.abs(d)>1){ freq=Math.min(5000,Math.max(4000,freq+Math.round(d*1.3))); updateRadio(); lastA=a; }});
knob.addEventListener('pointerup',()=>isDrag=false);
function getA(e){ let r=knob.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI; }
document.getElementById('chassis').addEventListener('wheel',e=>{ if(!powerOn) return; e.preventDefault(); nudge(e.deltaY>0?-1:1); },{passive:false});
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') nudge(-1); if(e.key==='ArrowRight') nudge(1); });
function waterfall(){
  if(!powerOn) return;
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let x=0;x<canvas.width;x+=3){ let n=Math.random(), y=Math.floor(Math.random()*canvas.height), br=0.1+n*0.25; ctx.fillStyle=`rgba(${100*br},${100*br},${100*br},${0.3+n*0.4})`; ctx.fillRect(x,y,2,1); }
  let cx=((freq-4000)/1000)*canvas.width; ctx.fillStyle='rgba(50,50,50,0.6)'; ctx.fillRect(cx,0,1,canvas.height); requestAnimationFrame(waterfall);
}
document.getElementById('batLid').addEventListener('click', ()=>{
  let box=document.getElementById('batteryBox');
  if(!box.classList.contains('open')){ box.classList.add('open'); if(powerOn) togglePower(); } else box.classList.remove('open');
});
setInterval(()=>{ let el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString(); },1000);
</script>
</body>
</html>
