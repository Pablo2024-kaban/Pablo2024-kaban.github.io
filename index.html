<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Р-326М</title>
<style>
  body{background:#080808;color:#9a9a8a;font-family:monospace;display:flex;justify-content:center;padding:12px}
  .container{max-width:820px;width:100%}
  .top-bar{border:1px solid #1a1a1a;background:#0a0a0a;padding:7px 10px;display:flex;justify-content:space-between}
  .hash-top{color:#2a2a1e;font-size:11px;word-break:break-all}.clock{color:#151515;font-size:10px}
  .radio-chassis{margin-top:12px;background:linear-gradient(180deg,#1c1a12 0%, #0e0d0a 100%);border:2px solid #25231c;padding:14px}
  .radio-top{display:grid;grid-template-columns:1fr 240px;gap:14px}
  @media(max-width:780px){.radio-top{grid-template-columns:1fr}}
  .display-section{background:#000;border:1px solid #151515;padding:9px}
  .freq-led{font-size:42px;color:#b0b0a0;text-align:center;letter-spacing:4px;background:#050505;padding:10px;border:1px solid #1a1a1a}
  .scale{position:relative;height:34px;background:#080808;border:1px solid #141414;margin-top:10px}
  .tick{position:absolute;bottom:0;width:1px;background:#1f1f1f}.tick.major{height:18px;background:#2a2a2a}
  .pointer{position:absolute;top:0;bottom:0;width:1px;background:#3a3a3a}
  .s-meter{margin-top:9px;display:flex;gap:2px;height:14px;background:#000;border:1px solid #111;padding:2px}
  .s-bar{width:8%;background:#0e0e0e;height:100%}.s-bar.active{background:#3a3a3a}
  .waterfall{height:46px;background:#000;border:1px solid #0e0e0e;margin-top:8px;overflow:hidden}canvas{width:100%;height:100%;display:block;filter:grayscale(1)}
  .knob-section{background:#0f0f0f;border:1px solid #151515;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .knob{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #3a3a3a 0%, #151515 50%, #070707 100%);border:1px solid #222;position:relative;cursor:grab;touch-action:none;flex-shrink:0}
  .knob-mark{position:absolute;left:50%;top:8%;width:2px;height:16px;background:#666;transform:translateX(-50%)}
  .power-btn{padding:6px 12px;background:#0f0f0f;color:#2a2a2a;border:1px solid #1d1d1d;cursor:pointer;font-family:monospace;font-size:11px}
  .power-btn.on{color:#777;border-color:#333}
  .controls{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .ctrl-btn{background:#0a0a0a;color:#2e2e2e;border:1px solid #181818;padding:4px 8px;cursor:pointer;font-family:monospace;font-size:10px}
  input[type=range]{width:100%;accent-color:#222;height:24px;background:#0a0a0a}
  .freq-info{display:flex;justify-content:space-between;font-size:8px;color:#1a1a1a}
  .status{margin-top:10px;min-height:70px;background:#000;border:1px solid #0f0f0f;padding:8px;font-size:12px;color:#4a4a3a}
  .status.locked{border-color:#222;color:#7a7a6a}.found{background:#050505;border:1px solid #1a1a1a;padding:7px;color:#8a8a7a}
  .battery-under{width:100%;margin-top:6px}
  .battery-box{width:100%;border:1px solid #201e15;background:#0a0906;border-radius:3px;overflow:hidden}
  .battery-lid-visual{width:100%;height:64px;background:#1d1b12;border:1px solid #2a281c;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 #3a3828}
  .battery-lid-visual:hover{background:#232114}
  .lid-screw{position:absolute;width:6px;height:6px;background:#0a0a0a;border:1px solid #3a382a;border-radius:50%}
  .lid-screw.tl{top:4px;left:4px}.lid-screw.tr{top:4px;right:4px}.lid-screw.bl{bottom:4px;left:4px}.lid-screw.br{bottom:4px;right:4px}
  .lid-text{font-size:9px;color:#5a5642;text-align:center;max-width:150px}
  .battery-inner{max-height:0;overflow:hidden;transition:max-height 0.7s ease,padding 0.5s;background:#050505;padding:0 10px}
  .battery-box.open .battery-inner{max-height:420px;padding:10px}
  .flag-sleep{font-size:14px;color:#ffcc33;background:#111;display:inline-block;padding:5px 8px;border:1px solid #333;margin:8px 0}
  .bat-visual{display:flex;gap:12px;align-items:center;justify-content:center}
  .bat-slot{width:96px;background:#080808;border:1px inset #1e1e1e;padding:6px;display:flex;flex-direction:column;gap:6px}
  .bat-empty{height:18px;background:#000;border:1px dashed #1c1c1c;color:#141414;font-size:7px;display:flex;align-items:center;justify-content:center}
  .bat-removed{display:flex;flex-direction:column;gap:8px;transform:translateY(20px);opacity:0;transition:all 0.5s 0.25s ease}
  .battery-box.open .bat-removed{transform:translateY(0);opacity:1}
  .battery{width:72px;height:20px;background:linear-gradient(90deg,#2a2a1a 0%, #3d381c 100%);border:1px solid #444;border-radius:2px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar"><span class="hash-top">f84edce385ed38b1b008771628c9df65</span><span class="clock" id="clock">--:--:--</span></div>
  <div class="radio-chassis" id="chassis">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;"><button class="power-btn" id="powerBtn">⏻ ВКЛ</button></div>
    <div class="radio-top">
      <div class="display-section">
        <div class="freq-led" id="freqDisplay">----<small>кГц</small></div>
        <div class="scale" id="scale"></div>
        <div class="s-meter" id="sMeter"></div>
        <div class="waterfall"><canvas id="wf" width="600" height="46"></canvas></div>
        <div style="margin-top:9px"><input type="range" id="freqSlider" min="4000" max="5000" value="4077" step="1" disabled><div class="freq-info"><span>4000</span><span>5000</span></div></div>
        <div class="controls"><button class="ctrl-btn" data-d="-10">-10</button><button class="ctrl-btn" data-d="-1">-1</button><button class="ctrl-btn" id="scanL">SCAN ◀</button><button class="ctrl-btn" id="scanR">▶ SCAN</button><button class="ctrl-btn" data-d="1">+1</button><button class="ctrl-btn" data-d="10">+10</button></div>
        <div class="status" id="status">Питание выключено. Нажми ВКЛ.</div>
      </div>
      <div class="knob-section">
        <div class="knob" id="knob"><div class="knob-mark"></div></div>
        <div style="font-size:7px;color:#333">TUNE</div>
        <div class="battery-under">
          <div class="battery-box" id="batteryBox">
            <div class="battery-lid-visual" id="batLid"><div class="lid-screw tl"></div><div class="lid-screw tr"></div><div class="lid-screw bl"></div><div class="lid-screw br"></div><div class="lid-text">вынуть батарейки и лечь спать</div></div>
            <div class="battery-inner">
              <div class="bat-visual"><div class="bat-slot"><div class="bat-empty">EMPTY</div><div class="bat-empty">EMPTY</div></div><div class="bat-removed"><div class="battery"><span>+</span><span>BR7</span><span>-</span></div><div class="battery"><span>+</span><span>BR7</span><span>-</span></div></div></div>
              <div style="text-align:center;margin-top:10px"><div style="color:#4a4a3a;font-size:8px">БАТАРЕЙКИ ВЫНУТЫ</div><div class="flag-sleep">SLEEP-TIL-NOON</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="stormAudio" src="u.mp3" preload="auto"></audio>
<audio id="b7Audio" src="Pastebin.mp3" preload="auto"></audio>

<script>
let powerOn=false, freq=4077, scanning=null;
const slider=document.getElementById('freqSlider'), display=document.getElementById('freqDisplay'), statusEl=document.getElementById('status');
const storm=document.getElementById('stormAudio'), b7=document.getElementById('b7Audio');
const knob=document.getElementById('knob'), scaleEl=document.getElementById('scale'), sMeterEl=document.getElementById('sMeter');
const powerBtn=document.getElementById('powerBtn'), canvas=document.getElementById('wf'), ctx=canvas.getContext('2d');

for(let f=4000;f<=5000;f+=20){let perc=(f-4000)/10;let t=document.createElement('div');t.className=(f%100===0)?'tick major':'tick';t.style.left=perc+'%';t.style.height=(f%100===0)?'18px':'8px';scaleEl.appendChild(t);}
let ptr=document.createElement('div');ptr.className='pointer';scaleEl.appendChild(ptr);
for(let i=0;i<12;i++){let b=document.createElement('div');b.className='s-bar';b.id='s'+i;sMeterEl.appendChild(b);}

let audioCtx, whiteNode, whiteGain;
function initWhite(){
  try{
    if(audioCtx){ try{ audioCtx.close(); }catch(e){} }
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let len=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.36;
    whiteNode=audioCtx.createBufferSource(); whiteNode.buffer=buf; whiteNode.loop=true;
    whiteGain=audioCtx.createGain(); whiteGain.gain.value=0;
    whiteNode.connect(whiteGain).connect(audioCtx.destination); whiteNode.start();
  }catch(e){}
}

function togglePower(){
  if(!powerOn){
    let box=document.getElementById('batteryBox'); if(box.classList.contains('open')) box.classList.remove('open');
    initWhite(); if(audioCtx) audioCtx.resume().catch(()=>{});
    powerOn=true; powerBtn.textContent='⏻ ВЫКЛ'; powerBtn.classList.add('on'); slider.disabled=false;
    statusEl.textContent='ШШШ...';
    storm.volume=0; b7.volume=0;
    storm.currentTime=0; b7.currentTime=0;
    try{ storm.play(); }catch(e){} try{ b7.play(); }catch(e){}
    // паузим сразу чтобы не было дубля, потом включим нужный
    try{ storm.pause(); b7.pause(); }catch(e){}
    if(whiteGain) whiteGain.gain.value=0.38;
    updateRadio(); requestAnimationFrame(waterfall);
  }else{
    powerOn=false; powerBtn.textContent='⏻ ВКЛ'; powerBtn.classList.remove('on'); slider.disabled=true;
    try{ storm.pause(); b7.pause(); }catch(e){}
    if(whiteGain) whiteGain.gain.value=0;
    statusEl.textContent='Питание выключено.';
  }
}

function updateRadio(){
  if(!powerOn) return;
  display.textContent=freq;
  ptr.style.left=((freq-4000)/10)+'%';
  let deg=((freq-4000)/1000)*270-135; knob.style.transform=`rotate(${deg}deg)`;
  let dS=Math.abs(freq-4210), dB=Math.abs(freq-4825);
  let bars = Math.max(0, 12 - Math.min(dS,dB));
  for(let i=0;i<12;i++){ document.getElementById('s'+i).className='s-bar'+(i<bars?' active':''); }

  // ШУМ + один mp3
  if(freq===4210){
    if(whiteGain) whiteGain.gain.value=0.06;
    try{ b7.pause(); }catch(e){}
    try{ if(storm.paused){ storm.currentTime=0; storm.play(); } }catch(e){}
    statusEl.className='status locked';
    statusEl.innerHTML=`<div class="found">> 4210 кГц — LOCK</div>`;
  }else if(freq===4825){
    if(whiteGain) whiteGain.gain.value=0.06;
    try{ storm.pause(); }catch(e){}
    try{ if(b7.paused){ b7.currentTime=0; b7.play(); } }catch(e){}
    statusEl.className='status locked';
    statusEl.innerHTML=`<div class="found">> 4825 кГц — LOCK</div>`;
  }else{
    if(whiteGain) whiteGain.gain.value=0.38;
    try{ storm.pause(); b7.pause(); }catch(e){}
    statusEl.className='status';
    if(dS<=8) statusEl.textContent=`${freq} — ...сигнал... S=${bars}`;
    else if(dB<=8) statusEl.textContent=`${freq} — ...сигнал... S=${bars}`;
    else statusEl.textContent=`${freq} — ШШШ... S=${bars}`;
  }
}

function nudge(d){ if(!powerOn) return; freq=Math.min(5000,Math.max(4000,freq+d)); updateRadio(); }
function autoScan(dir){ if(!powerOn) return; if(scanning) clearInterval(scanning); scanning=setInterval(()=>{ freq+=dir; if(freq>5000||freq<4000){ clearInterval(scanning); return; } updateRadio(); if(freq===4210||freq===4825) clearInterval(scanning); },115); }

document.getElementById('powerBtn').addEventListener('click', togglePower);
document.querySelectorAll('.ctrl-btn[data-d]').forEach(b=>b.addEventListener('click', ()=>nudge(parseInt(b.dataset.d))));
document.getElementById('scanL').addEventListener('click', ()=>autoScan(-1));
document.getElementById('scanR').addEventListener('click', ()=>autoScan(1));
slider.addEventListener('input', e=>{ if(!powerOn) return; freq=parseInt(e.target.value); updateRadio(); });

let isDrag=false,lastA=0;
knob.addEventListener('pointerdown',e=>{ if(!powerOn) return; isDrag=true; knob.setPointerCapture(e.pointerId); lastA=getA(e); });
knob.addEventListener('pointermove',e=>{ if(!isDrag||!powerOn) return; let a=getA(e), d=a-lastA; if(d>180)d-=360; if(d<-180)d+=360; if(Math.abs(d)>1){ freq=Math.min(5000,Math.max(4000,freq+Math.round(d*1.3))); updateRadio(); lastA=a; }});
knob.addEventListener('pointerup',()=>isDrag=false);
function getA(e){ let r=knob.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI; }
document.getElementById('chassis').addEventListener('wheel',e=>{ if(!powerOn) return; e.preventDefault(); nudge(e.deltaY>0?-1:1); },{passive:false});
window.addEventListener('keydown',e=>{ if(!powerOn) return; if(e.key==='ArrowLeft') nudge(-1); if(e.key==='ArrowRight') nudge(1); });

function waterfall(){
  if(!powerOn) return;
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let x=0;x<canvas.width;x+=3){ let y=Math.random()*canvas.height; ctx.fillStyle='rgba(90,90,90,'+(0.2+Math.random()*0.3)+')'; ctx.fillRect(x,y,1,1); }
  let cx=((freq-4000)/1000)*canvas.width; ctx.fillStyle='rgba(60,60,60,0.6)'; ctx.fillRect(cx,0,1,canvas.height); requestAnimationFrame(waterfall);
}
document.getElementById('batLid').addEventListener('click', ()=>{
  let box=document.getElementById('batteryBox');
  if(!box.classList.contains('open')){ box.classList.add('open'); if(powerOn) togglePower(); } else box.classList.remove('open');
});
setInterval(()=>{ let el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString(); },1000);
</script>
</body>
</html>
